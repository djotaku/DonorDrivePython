[project]
name = "DonorDrivePython"
version = "1.6.0"
description = "A utility to access the DonorDrive API"
license = "GPL-3.0-or-later"
authors = [{ name = "Eric Mesa", email = "ericsbinaryworld@gmail.com" }]
readme = "README.rst"
requires-python = ">=3.10,<4.0"
dependencies = [
    "rich>=12.4.4,<13.0.0",
    "requests==2.28.1",
    "xdgenvpy>=2.3.5,<3.0.0",
]

[project.urls]
Repository = "https://github.com/djotaku/DonorDrivePython"

[dependency-groups]
dev = ["pytest>=6.2.5,<7.0.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["donordrivepython"]
